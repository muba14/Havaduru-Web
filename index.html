<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="HavaDuru: canlı hava durumu, 10 günlük tahmin, polen, 3B dünya hava haritası, yağış radarı ve paylaşılabilir hava kartı.">
<meta name="theme-color" content="#2466E0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='5' fill='%23E08A0B'/%3E%3Cg stroke='%23E08A0B' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2'/%3E%3C/g%3E%3C/svg%3E">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>HavaDuru</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Yerleşim: üst çubuk (ad, birim/dil, ülke/şehir) → favoriler şeridi → aktivite → derece + gökyüzü sahnesi → ölçümler → grafik → güneş | ay → yağış radarı */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --surface-2:#F4F7FB; --line:#DCE3EC;
  --fg:#101B2D; --muted:#5C6B80; --accent:#2466E0; --accent-soft:#DCE8FF;
  --sun:#E08A0B; --good:#1F9D62; --warn:#C98A04; --bad:#D4492F;
  --shadow:0 1px 2px rgba(16,27,45,.05),0 12px 32px -18px rgba(16,27,45,.25);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A111E; --surface:#111B2D; --surface-2:#172338; --line:#24324A;
  --fg:#E8EEF7; --muted:#93A2B8; --accent:#6EA2FF; --accent-soft:#1B2D4F;
  --sun:#F5B041; --good:#4CC38A; --warn:#E3B341; --bad:#F0705A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 36px -20px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A111E; --surface:#111B2D; --surface-2:#172338; --line:#24324A;
  --fg:#E8EEF7; --muted:#93A2B8; --accent:#6EA2FF; --accent-soft:#1B2D4F;
  --sun:#F5B041; --good:#4CC38A; --warn:#E3B341; --bad:#F0705A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 36px -20px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* üst çubuk */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand svg{color:var(--sun)}
.prefs{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.bar .seg{background:var(--surface);border:1px solid var(--line)}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.panel .seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(16,27,45,.14)}
.pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{position:relative;display:flex;align-items:center}
.field>svg{position:absolute;left:11px;color:var(--muted);pointer-events:none}
.field select,.field input{background:var(--surface);border:1px solid var(--line);border-radius:999px;height:40px;padding:0 14px 0 34px;min-width:0}
.field select{appearance:none;padding-right:30px;cursor:pointer;max-width:190px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px;background-size:5px 5px;background-repeat:no-repeat}
.field input{width:190px}
.field input::placeholder{color:var(--muted)}
.results{position:absolute;top:46px;left:0;right:0;min-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:40;display:flex;flex-direction:column}
.results button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:9px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--surface-2)}
.results small{color:var(--muted);display:block}
.results .none{padding:8px 10px;color:var(--muted)}

.note{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--accent-soft);border-radius:14px;padding:10px 14px;font-size:13.5px}
.note b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* favoriler */
.favs{display:flex;flex-direction:column;gap:8px;min-width:0}
.favs-h{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.favs-h svg{color:var(--sun)}
.favs-msg{text-transform:none;letter-spacing:0;font-weight:500;color:var(--bad)}
.fav-row{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;scrollbar-width:thin}
.fav{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 14px 10px 10px;cursor:pointer;text-align:left;min-width:168px;box-shadow:var(--shadow)}
.fav:hover{border-color:var(--accent)}
.fav[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.fav svg{flex:none}
.fav-n{display:flex;flex-direction:column;min-width:0;flex:1}
.fav-n b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.fav-n small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.fav-t{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.02em}
.fav-empty{color:var(--muted);font-size:13.5px;padding:10px 2px}

/* aktivite önerisi */
.act{display:flex;align-items:center;gap:16px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px 20px;min-width:0}
.act-ic{flex:none;width:56px;height:56px;border-radius:18px;background:color-mix(in srgb,var(--tint,var(--accent)) 16%,var(--surface));display:grid;place-items:center}
.act-ic svg{width:34px;height:34px}
.act-b{min-width:0;flex:1}
.act-l{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.act-t{font-family:var(--display);font-weight:600;font-size:clamp(19px,2.4vw,24px);letter-spacing:-.015em;line-height:1.2;margin-top:2px;text-wrap:balance}
.act-s{color:var(--muted);font-size:14.5px;margin-top:3px}

/* aktivite + bilgi kartları yan yana */
.tips{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;min-width:0}
.fact{align-items:flex-start}
.fact .act-t{font-family:var(--body);font-weight:500;font-size:16px;letter-spacing:0;line-height:1.45;text-wrap:pretty}
.fact-more{margin-top:8px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px 5px 10px;font-size:13px;font-weight:500;cursor:pointer;color:var(--fg)}
.fact-more:hover{border-color:var(--accent)}
.fact-more svg{color:var(--accent)}
@media (max-width:900px){.tips{grid-template-columns:1fr}}

/* kahraman alan */
.hero{position:relative;overflow:hidden;border-radius:28px;background:var(--surface);box-shadow:var(--shadow);min-height:330px;display:flex}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;
  -webkit-mask-image:linear-gradient(to right,transparent 0%,rgba(0,0,0,.06) 26%,rgba(0,0,0,.45) 52%,rgba(0,0,0,.85) 76%,#000 100%);
          mask-image:linear-gradient(to right,transparent 0%,rgba(0,0,0,.06) 26%,rgba(0,0,0,.45) 52%,rgba(0,0,0,.85) 76%,#000 100%)}
.hero-txt{position:relative;padding:28px 32px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-width:0;max-width:62%}
.place{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.place>svg{color:var(--accent);flex:none}
.star{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--muted);margin-left:4px}
.star:hover{color:var(--sun);border-color:var(--sun)}
.star[aria-pressed="true"]{color:var(--sun);border-color:var(--sun)}
.star[aria-pressed="true"] svg{fill:var(--sun)}
.when{color:var(--muted);font-size:14px;margin-top:2px}
.temp-row{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.temp{font-family:var(--display);font-weight:700;font-size:clamp(96px,17vw,172px);line-height:.86;letter-spacing:-.055em}
.temp sup{font-size:.34em;font-weight:600;letter-spacing:0;vertical-align:top;position:relative;top:.18em;margin-left:.06em;color:var(--muted)}
.cond{padding-top:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.cond strong{font-family:var(--display);font-weight:600;font-size:clamp(20px,2.6vw,28px);letter-spacing:-.015em;line-height:1.1}
.cond>span{color:var(--muted);font-size:14.5px}
.diff{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:4px 10px 4px 7px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.diff svg{color:var(--dc,var(--muted))}
.hilo{display:flex;gap:16px;flex-wrap:wrap;font-size:14.5px;color:var(--muted)}
.hilo b{color:var(--fg);font-weight:600}
.hilo span{display:inline-flex;align-items:center;gap:5px}

/* ölçümler */
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.m{background:var(--surface);padding:16px 16px 15px;display:flex;flex-direction:column;gap:6px;min-width:0}
.m-l{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.m-l svg{flex:none;color:var(--accent)}
.m-v{font-family:var(--display);font-weight:600;font-size:27px;letter-spacing:-.02em;line-height:1.1;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.m-v small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.m-s{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;min-height:20px}
.meter{height:5px;border-radius:9px;background:var(--surface-2);flex:1;overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px;background:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;color:var(--fg)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc,var(--good))}
.arrow{display:inline-flex;transition:transform .5s}

/* paneller */
.panel{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:20px 22px;min-width:0}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
h2{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:8px}
h2 svg{color:var(--accent)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart text{font-family:var(--body);font-size:11.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .val{fill:var(--fg);font-weight:600;font-size:12px}
.tip{position:absolute;top:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:6px 10px;font-size:12.5px;white-space:nowrap;transform:translateX(-50%)}
.tip b{font-weight:600}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:3px;vertical-align:middle;margin-right:5px}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
#sunArc svg{display:block;width:100%;max-width:420px;margin:0 auto;height:auto}
#sunArc text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.rows{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.rows div{display:flex;flex-direction:column;gap:1px;min-width:0}
.rows span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.rows span svg{color:var(--sun);flex:none}
.rows b{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em}
.moon-main{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.moon-main svg{flex:none}
.moon-name{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.015em;line-height:1.15}
.moon-sub{color:var(--muted);font-size:14px;margin-top:3px}
.phases{display:flex;justify-content:space-between;gap:4px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.phases div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);text-align:center;flex:1;min-width:0;opacity:.55}
.phases div.on{opacity:1;color:var(--fg);font-weight:600}
.moon-dark{fill:var(--surface-2);stroke:var(--line)}
.moon-lit{fill:var(--sun)}
.phases .moon-lit{fill:var(--muted)} .phases .on .moon-lit{fill:var(--sun)}

/* radar */
.map-wrap{position:relative;isolation:isolate;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
#map{height:400px;width:100%;background:var(--surface-2)}
.map-msg{position:absolute;inset:0;z-index:1200;display:grid;place-items:center;padding:24px;text-align:center;background:color-mix(in srgb,var(--surface-2) 88%,transparent);color:var(--muted);font-size:14px}
.map-msg div{max-width:46ch;display:flex;flex-direction:column;align-items:center;gap:8px}
.map-msg svg{color:var(--accent)}
.map-msg b{color:var(--fg);font-family:var(--display);font-weight:600;font-size:17px}
.rctl{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.playbtn{flex:none;width:40px;height:40px;border-radius:999px;border:0;background:var(--accent);color:var(--surface);display:grid;place-items:center;cursor:pointer}
.playbtn:disabled{opacity:.4;cursor:default}
.rctl input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.rtime{font-weight:600;min-width:7ch}
.rscale{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.rscale i{display:block;width:120px;height:8px;border-radius:9px;background:linear-gradient(90deg,#9BE1F2,#2FA4E0,#0C5FB8,#F5E600,#F59A00,#F04400,#B80000,#F2A8F2)}
/* Leaflet'in gerekli stilleri (yalnızca kullanılan kısım) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:var(--body);font-size:12px}
.leaflet-tile{user-select:none;-webkit-user-drag:none;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-interactive{cursor:pointer}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-left .leaflet-control{margin-left:10px}
.leaflet-control-zoom{border-radius:12px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.leaflet-control-zoom a{display:block;width:34px;height:34px;line-height:32px;text-align:center;text-decoration:none;font-size:20px;background:var(--surface);color:var(--fg)}
.leaflet-control-zoom a+a{border-top:1px solid var(--line)}
.leaflet-control-zoom a:hover{background:var(--surface-2)}
.leaflet-control-zoom a.leaflet-disabled{color:var(--muted);opacity:.5;cursor:default}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--muted);padding:1px 6px;font-size:10.5px;border-top-left-radius:8px}
.leaflet-control-attribution a{color:inherit}

/* dünya küresi: bilerek her temada koyu "uzay" görünümü */
.space{--sp-fg:#E8EEF7;--sp-muted:#9AA9C0;--sp-line:rgba(255,255,255,.12);color:var(--sp-fg);background:radial-gradient(120% 90% at 50% 40%,#10224A 0%,#071026 55%,#030713 100%);border-radius:22px;box-shadow:var(--shadow);padding:20px 22px;min-width:0;position:relative;overflow:hidden}
.space h2 svg{color:#7FB2FF}
.space .when{color:var(--sp-muted)}
.space .seg{background:rgba(255,255,255,.07);border:1px solid var(--sp-line)}
.space .seg button{color:var(--sp-muted)}
.space .seg button[aria-pressed="true"]{background:#E8EEF7;color:#0A1328;box-shadow:none}
.globe-box{position:relative;height:460px;margin-top:4px;touch-action:none;cursor:grab}
.globe-box.drag{cursor:grabbing}
.globe-box canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.gstars{position:absolute;inset:0;pointer-events:none;opacity:.7;background-image:radial-gradient(1px 1px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 78% 12%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 88% 64%,#cfe0ff 50%,transparent 51%),radial-gradient(1px 1px at 22% 78%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 52% 6%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 6% 52%,#cfe0ff 50%,transparent 51%),radial-gradient(1px 1px at 64% 92%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 93% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 35% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 70% 45%,#fff 50%,transparent 51%)}
.gtip{position:absolute;pointer-events:none;background:rgba(232,238,247,.95);color:#0A1328;border-radius:10px;padding:6px 10px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-130%);z-index:2}
.gtip b{font-weight:700}
.gmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--sp-muted);padding:20px}
.gfoot{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--sp-muted)}
.gscale{display:flex;flex-direction:column;gap:4px;flex:1;min-width:220px;max-width:420px}
.gscale i{display:block;height:8px;border-radius:9px}
.gscale div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.gstate{margin-left:auto;display:inline-flex;align-items:center;gap:6px}
.gstate::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gs,#4CC38A)}
@media (max-width:560px){.globe-box{height:340px}}

/* 10 günlük tahmin */
.d10{display:flex;flex-direction:column}
.d10-r{display:grid;grid-template-columns:minmax(76px,120px) 34px 52px 40px minmax(60px,1fr) 40px;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);min-width:0}
.d10-r:first-child{border-top:0}
.d10-d{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.d10-d b{font-weight:600}
.d10-d small{color:var(--muted);font-size:12.5px}
.d10-p{font-size:13px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.d10-p.dry{color:transparent}
.d10-lo,.d10-hi{font-family:var(--display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.d10-lo{color:var(--muted);text-align:right}
.d10-bar{position:relative;height:6px;border-radius:9px;background:var(--surface-2)}
.d10-bar i{position:absolute;top:0;bottom:0;border-radius:9px}
.d10-bar b{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--surface);border:3px solid var(--fg)}
@media (max-width:560px){.d10-r{grid-template-columns:62px 28px 40px 34px minmax(40px,1fr) 34px;gap:8px}.d10-d small{display:none}.d10-lo,.d10-hi{font-size:15.5px}}

/* konum düğmesi */
.locbtn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 15px 0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;color:var(--fg)}
.locbtn svg{color:var(--accent);flex:none}
.locbtn:hover{border-color:var(--accent)}
.locbtn.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* polen */
.pol-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pol-risk{display:inline-flex;align-items:center;gap:7px;font-weight:600;padding:5px 12px 5px 10px;border-radius:999px;background:color-mix(in srgb,var(--pc) 15%,var(--surface));color:var(--fg)}
.pol-risk::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--pc)}
.pol-sub{color:var(--muted);font-size:14px}
.pol-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.pol{background:var(--surface-2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pol b{font-weight:600;font-size:14px}
.pol span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pol-m{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.pol-m i{height:5px;border-radius:9px;background:var(--line)}
.pol-na{color:var(--muted);font-size:14px;padding:4px 0}
.pol-foot{margin-top:10px;font-size:12.5px;color:var(--muted)}
@media (max-width:900px){.pol-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.pol-grid{grid-template-columns:repeat(2,1fr)}}

/* mikro animasyonlar ve klavye */
@keyframes rise{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}
.rise{animation:rise .45s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion:reduce){.rise{animation:none}}
.skip{position:absolute;left:16px;top:-60px;z-index:4000;background:var(--accent);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;text-decoration:none}
.skip:focus{top:calc(10px + env(safe-area-inset-top,0px))}
.globe-box:focus-visible{outline:2px solid #7FB2FF;outline-offset:-2px;border-radius:16px}
.keys{display:block;margin-top:4px}
kbd{font-family:var(--body);font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}

/* paylaşım penceresi */
.seg button svg{display:block}
.modal{position:fixed;inset:0;z-index:3000;background:rgba(5,10,22,.62);display:grid;place-items:center;padding:16px}
.mbox{background:var(--surface);color:var(--fg);border-radius:22px;box-shadow:var(--shadow);padding:18px;width:min(460px,100%);max-height:calc(100% - 8px);display:flex;flex-direction:column;gap:12px;overflow:auto}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mhead h2{font-size:18px}
.xbtn{border:0;background:var(--surface-2);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.mprev{display:grid;place-items:center;background:var(--surface-2);border-radius:14px;padding:12px;min-height:220px}
.mprev img{max-height:min(54vh,560px);max-width:100%;border-radius:12px;box-shadow:0 10px 30px -12px rgba(0,0,0,.5)}
.mprev span{color:var(--muted);font-size:14px}
.mact{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14.5px;color:var(--fg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:3100;box-shadow:var(--shadow)}

footer{color:var(--muted);font-size:12.5px;text-align:center;padding-top:4px}
footer a{color:inherit}

@media (max-width:900px){.metrics{grid-template-columns:repeat(3,1fr)}.duo{grid-template-columns:1fr}}
@media (max-width:560px){
  .wrap{padding-inline:16px}

  .hero{min-height:300px}.hero-txt{padding:22px;max-width:80%}
  .pick{width:100%}.field{flex:1 1 130px}.field select,.field input{width:100%;max-width:none}
  .rows b{font-size:17px}.chips{margin-left:0}
  .phases div span{display:none}
  #map{height:320px}
  .rscale{width:100%}
}
@media (prefers-reduced-motion:reduce){.arrow{transition:none}}

async function getJSON(u,ms=7000){const c=new AbortController(),tm=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(tm)}}
async function fetchLive(c){
  const q=`latitude=${c.lat}&longitude=${c.lon}&timezone=auto`;
  const f=getJSON(`https://api.open-meteo.com/v1/forecast?${q}&past_days=1&forecast_days=11&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure&hourly=temperature_2m,precipitation_probability,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max`);
  const a=getJSON(`https://air-quality-api.open-meteo.com/v1/air-quality?${q}&current=european_aqi,pm2_5,pm10,alder_pollen,birch_pollen,grass_pollen,mugwort_pollen,olive_pollen,ragweed_pollen`).catch(()=>null);
  const [w,aq]=await Promise.all([f,a]);
  const now=pIso(w.current.time),H=w.hourly,D=w.daily;
  let i0=H.time.findIndex(x=>pIso(x)>now-3600e3);if(i0<0)i0=0;
  const yi=H.time.findIndex(x=>pIso(x)===Math.floor(now/36e5)*36e5-864e5);
  let d0=D.time.indexOf(w.current.time.slice(0,10));if(d0<0)d0=0;
  return{now,off:(w.utc_offset_seconds||0)*1000,yest:yi>=0?H.temperature_2m[yi]:null,
    cur:{t:w.current.temperature_2m,feels:w.current.apparent_temperature,code:w.current.weather_code,isDay:!!w.current.is_day,hum:w.current.relative_humidity_2m,wind:w.current.wind_speed_10m,wdir:w.current.wind_direction_10m,pres:w.current.surface_pressure},
    pollen:aq&&aq.current?pollenOf(aq.current):null,
    aqi:aq&&aq.current&&aq.current.european_aqi!=null?{v:aq.current.european_aqi,pm25:aq.current.pm2_5,pm10:aq.current.pm10}:null,
    hourly:H.time.slice(i0,i0+25).map((x,k)=>({t:pIso(x),temp:H.temperature_2m[i0+k],pop:H.precipitation_probability?H.precipitation_probability[i0+k]:null,code:H.weather_code[i0+k],day:!!H.is_day[i0+k]})),
    daily:D.time.slice(d0,d0+10).map((x,j)=>{const k=d0+j;return{t:pIso(x),code:D.weather_code[k],max:D.temperature_2m_max[k],min:D.temperature_2m_min[k],sunrise:pIso(D.sunrise[k]),sunset:pIso(D.sunset[k]),uv:D.uv_index_max[k],pop:D.precipitation_probability_max?D.precipitation_probability_max[k]:null}})};
}
/* ---------- veri: örnek (API'ye ulaşılamazsa) ---------- */
function sunTimes(dayMs,lat,lon,offMin){
  const d=new Date(dayMs),doy=Math.floor((dayMs-Date.UTC(d.getUTCFullYear(),0,0))/864e5);
  const dec=-23.44*Math.cos(2*Math.PI*(doy+10)/365)*Math.PI/180,la=lat*Math.PI/180;
  const H=Math.acos(clamp(-Math.tan(la)*Math.tan(dec),-1,1))/Math.PI*12,noon=12+offMin/60-lon/15;
  return[dayMs+(noon-H)*36e5,dayMs+(noon+H)*36e5];
}
function demo(c,forceKind){
  const off=c.tz?tzOff(c.tz):Math.round(c.lon/15)*60,now=Date.now()+off*6e4,day0=Math.floor(now/864e5)*864e5;
  const R=rng(c.name+new Date(day0).toISOString().slice(0,10)),doy=(day0-Date.UTC(new Date(day0).getUTCFullYear(),0,0))/864e5;
  const season=Math.cos(2*Math.PI*(doy-196)/365)*(c.lat>=0?1:-1),mean=28-.35*Math.abs(c.lat)+season*Math.min(1.3,Math.abs(c.lat)/40)*10;
  const pool=[0,1,2,2,3,61,63,80,95,45];const pick=()=>{let k=pool[Math.floor(R()*pool.length)];if(mean<1&&k>=61&&k<95)k=73;return k};
  const force={clear:0,partly:2,cloudy:3,fog:45,rain:63,snow:73,storm:95}[forceKind];
  const dOff=[0];for(let i=1;i<11;i++)dOff.push(dOff[i-1]+(R()-.5)*3.2);
  const tAt=ms=>{const h=(ms-day0)/36e5,di=clamp(Math.floor(h/24),0,9),fr=clamp(h/24-di,0,1);return mean+dOff[di]*(1-fr)+dOff[di+1]*fr+5.2*Math.cos((h%24-15)/24*2*Math.PI)};
  const daily=[];for(let i=0;i<10;i++){const tt=day0+i*864e5,[sr,ss]=sunTimes(tt,c.lat,c.lon,off),code=i===0&&force!=null?force:pick();daily.push({t:tt,code,max:mean+dOff[i]+5.2,min:mean+dOff[i]-5.2,sunrise:sr,sunset:ss,uv:clamp(7*Math.cos((c.lat-season*20)*Math.PI/180)+R()*1.5,0,11),pop:['rain','storm','snow'].includes(kindOf(code))?55+R()*40:R()*25})}
  const code=daily[0].code,h0=Math.floor(now/36e5)*36e5,hourly=[];
  for(let i=0;i<25;i++){const tt=h0+i*36e5,di=clamp(Math.floor((tt-day0)/864e5),0,6);hourly.push({t:tt,temp:tAt(tt),pop:clamp(daily[di].pop+(R()-.5)*20,0,100),code:i<8?code:daily[di].code,day:tt>daily[di].sunrise&&tt<daily[di].sunset})}
  const tn=tAt(now),wind=6+R()*22+(kindOf(code)==='storm'?18:0),hum=clamp(45+R()*25+(['rain','storm','fog','snow'].includes(kindOf(code))?28:0),20,99);
  const inEU=c.lat>34&&c.lat<72&&c.lon>-25&&c.lon<45,mo=new Date(now).getUTCMonth(),sea=[0,.1,.6,1,1,.9,.7,.6,.4,.1,0,0][mo];
  const pollen=inEU?{alder:R()*40*(mo<4?1:0)*sea,birch:R()*300*(mo>=2&&mo<=4?1:0),olive:R()*120*(mo>=3&&mo<=5&&c.lat<45?1:0),grass:R()*60*sea,mugwort:R()*30*(mo>=6&&mo<=8?1:0),ragweed:R()*40*(mo>=7&&mo<=9?1:0)}:null;
  return{now,off:off*6e4,pollen,yest:tn+(R()-.5)*8,cur:{t:tn,feels:tn-wind*.07+(hum-55)*.03,code,isDay:now>daily[0].sunrise&&now<daily[0].sunset,hum,wind,wdir:R()*360,pres:1004+R()*20},aqi:{v:14+R()*58,pm25:5+R()*20,pm10:10+R()*30},hourly,daily};
}

function factPool(k,tc,wind,day){const c=[];

function tween(set,from,to,dec){const f=x=>dec?x.toFixed(dec):String(Math.round(x));
  if(matchMedia('(prefers-reduced-motion:reduce)').matches||from==null||!isFinite(from)||from===to){set(f(to));return}
  const t0=performance.now(),D=700,step=n=>{const p=Math.min(1,(n-t0)/D),e=1-Math.pow(1-p,3);set(f(from+(to-from)*e));if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
function animMetrics(){const next=[];document.querySelectorAll('#metrics .m-v').forEach((el,i)=>{const n=el.firstChild;if(!n||n.nodeType!==3)return;

function renderChart(){
  const el=$('#chart'),d=S.data;if(!d)return;
  const W=Math.max(300,el.clientWidth),Hh=236,L=38,R=16,T=52,B=30,daily=S.mode==='d';
  $('#legend').hidden=!daily;
  const pts=(daily?d.daily.slice(0,7):d.hourly).map(p=>({...p,temp:p.temp!=null?TC(p.temp):null,max:p.max!=null?TC(p.max):null,min:p.min!=null?TC(p.min):null})),n=pts.length;
  const series=daily?[{k:'max',col:'var(--sun)'},{k:'min',col:'var(--accent)'}]:[{k:'temp',col:'var(--accent)'}];
  const all=pts.flatMap(p=>series.map(s=>p[s.k]));let lo=Math.min(...all),hi=Math.max(...all);
  const step=[1,2,5,10,20].find(s=>(hi-lo)/s<=4)||20;lo=Math.floor((lo-.5)/step)*step;hi=Math.ceil((hi+.5)/step)*step;
  const X=i=>L+(W-L-R)*i/(n-1),Y=v=>T+(Hh-T-B)*(1-(v-lo)/(hi-lo));
  const path=k=>{let s=`M${X(0)} ${Y(pts[0][k])}`;for(let i=0;i<n-1;i++){const p0=pts[Math.max(0,i-1)][k],p1=pts[i][k],p2=pts[i+1][k],p3=pts[Math.min(n-1,i+2)][k],dx=(X(1)-X(0))/3;s+=` C${X(i)+dx} ${Y(p1+(p2-p0)/6)} ${X(i+1)-dx} ${Y(p2-(p3-p1)/6)} ${X(i+1)} ${Y(p2)}`}return s};
  const every=daily?1:(W<560?6:3);
  let g='';for(let v=lo;v<=hi+1e-9;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="${v===lo?'0':'3 5'}"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${v}°</text>`;
  let lab='';pts.forEach((p,i)=>{if(i%every)return;const anchor=i===0?'start':i===n-1?'end':'middle',x=X(i);
    lab+=`<text x="${x}" y="${Hh-8}" text-anchor="${anchor}">${daily?(i===0?t('today'):t('days')[new Date(p.t).getUTCDay()]):(i===0?t('now'):hm(p.t))}</text>`;
    const top=daily?p.max:p.temp,ix=clamp(x,L+10,W-R-10);
    lab+=wicon(kindOf(p.code),daily?true:p.day,ix,14,20)+`<text class="val" x="${ix}" y="40" text-anchor="middle">${r0(top)}°</text>`});
  const area=`${path(series[0].k)} L${X(n-1)} ${Y(lo)} L${X(0)} ${Y(lo)}Z`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${t('chartT')}"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${series[0].col}" stop-opacity=".28"/><stop offset="1" stop-color="${series[0].col}" stop-opacity="0"/></linearGradient></defs>${g}
   <path d="${area}" fill="url(#ar)" stroke="none"/>${series.map(s=>`<path d="${path(s.k)}" fill="none" stroke="${s.col}" stroke-width="2.6" stroke-linecap="round"/>`).join('')}
   ${series.map(s=>`<circle cx="${X(0)}" cy="${Y(pts[0][s.k])}" r="4.5" fill="var(--surface)" stroke="${s.col}" stroke-width="2.6"/>`).join('')}
   ${lab}<g id="hov" visibility="hidden"><line id="hl" y1="${T-4}" y2="${Hh-B}" stroke="var(--muted)" stroke-width="1"/>${series.map((s,i)=>`<circle id="hd${i}" r="5" fill="${s.col}" stroke="var(--surface)" stroke-width="2"/>`).join('')}</g>
   <rect id="hit" x="${L}" y="${T-10}" width="${W-L-R}" height="${Hh-T-B+10}" fill="transparent"/></svg><div class="tip" id="tip" hidden></div>`;
  const hit=el.querySelector('#hit'),hov=el.querySelector('#hov'),tip=el.querySelector('#tip');
  const move=e=>{const r=el.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width,i=clamp(Math.round((px-L)/(W-L-R)*(n-1)),0,n-1),p=pts[i];
    hov.setAttribute('visibility','visible');el.querySelector('#hl').setAttribute('x1',X(i));el.querySelector('#hl').setAttribute('x2',X(i));
    series.forEach((s,j)=>{const c=el.querySelector('#hd'+j);c.setAttribute('cx',X(i));c.setAttribute('cy',Y(p[s.k]))});
    tip.hidden=false;tip.style.left=clamp(X(i)*r.width/W,80,r.width-80)+'px';
    const rain=p.pop!=null?` · ${t('rain')} ${pct(r0(p.pop))}`:'';
    tip.innerHTML=daily?`${t('daysL')[new Date(p.t).getUTCDay()]} · <b>${r0(p.max)}° / ${r0(p.min)}°</b>${rain}`:`${hm(p.t)} · <b>${p.temp.toFixed(1)}°</b>${rain}`};
  hit.addEventListener('pointermove',move);hit.addEventListener('pointerdown',move);
  hit.addEventListener('pointerleave',()=>{hov.setAttribute('visibility','hidden');tip.hidden=true});
}

const SYN=29.530588853;
function moonSvg(p,size){
  const r=size/2-1.5,c=size/2,rx=Math.abs(Math.cos(2*Math.PI*p))*r,wax=p<.5,crescent=p<.25||p>.75;
  const lit=p<.012||p>.988?'':Math.abs(p-.5)<.012?`<circle cx="${c}" cy="${c}" r="${r}" class="moon-lit"/>`:
   `<path class="moon-lit" d="M${c} ${c-r} A${r} ${r} 0 0 ${wax?1:0} ${c} ${c+r} A${rx} ${r} 0 0 ${(wax?crescent:!crescent)?0:1} ${c} ${c-r}Z"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" class="moon-dark" stroke-width="1"/>${lit}</svg>`;
}
function renderMoon(){
  const age=(((Date.now()-Date.UTC(2000,0,6,18,14))/864e5)%SYN+SYN)%SYN,p=age/SYN,ill=(1-Math.cos(2*Math.PI*p))/2,idx=Math.round(p*8)%8;

  const nC={clear:1,partly:4,cloudy:8,fog:5,rain:8,snow:7,storm:9}[kind];
  SC.clouds=Array.from({length:nC},()=>({x:.3+R()*.8,y:.08+R()*(kind==='partly'?.3:.42),s:.6+R()*.8,v:.004+R()*.008,a:kind==='clear'?.35:.55+R()*.4}));
  const nD=kind==='rain'?110:kind==='storm'?150:kind==='snow'?90:0;
  SC.drops=Array.from({length:nD},()=>({x:R(),y:R(),l:.6+R()*.8,v:.7+R()*.6,ph:R()*6.28}));
  SC.stars=Array.from({length:70},()=>({x:R(),y:R()*.8,r:.4+R()*1.2,ph:R()*6.28}));

function cloud(x,y,s,col){cx.fillStyle=col;cx.beginPath();[[0,0,34],[-38,10,24],[36,8,27],[-14,-16,25],[18,-20,22],[-64,18,15],[64,17,16]].forEach(([dx,dy,r])=>{cx.moveTo(x+dx*s+r*s,y+dy*s);cx.arc(x+dx*s,y+dy*s,r*s,0,6.29)});cx.rect(x-64*s,y+10*s,128*s,23*s);cx.fill()}

/* hilal: ay dairesinden ikinci daireyi gerçekten çıkaran yol (arka plan rengine bağlı değil) */
function crescent(x,y,r,ox,oy,r2){const dx=ox-x,dy=oy-y,d=Math.hypot(dx,dy),a=(r*r-r2*r2+d*d)/(2*d),h=Math.sqrt(Math.max(0,r*r-a*a)),px=x+a*dx/d,py=y+a*dy/d;
  const ax=px-h*dy/d,ay=py+h*dx/d,bx=px+h*dy/d,by=py-h*dx/d,M=v=>((v%6.2832)+6.2832)%6.2832,inside=(st,en,g)=>M(g-st)<M(en-st);
  const phi=Math.atan2(dy,dx),tA=Math.atan2(ay-y,ax-x),tB=Math.atan2(by-y,bx-x),uA=Math.atan2(ay-oy,ax-ox),uB=Math.atan2(by-oy,bx-ox);

    const a=c.a*(d?1:.6),tone=dark?(d?`rgba(70,82,104,${a})`:`rgba(40,48,68,${a})`):d?`rgba(255,255,255,${a})`:`rgba(150,165,198,${a})`;
    cloud(c.x*W,c.y*H,c.s*(skyMul>1?skyMul:Math.max(.7,H/330)),tone)});
  if(k==='fog'){for(let i=0;i<6;i++){const y=H*(.2+i*.14),o=Math.sin(SC.t*.25+i)*W*.05,fg=cx.createLinearGradient(0,y,0,y+H*.12),c1=d?'235,238,243':'150,158,172';fg.addColorStop(0,`rgba(${c1},0)`);fg.addColorStop(.5,`rgba(${c1},.5)`);fg.addColorStop(1,`rgba(${c1},0)`);cx.fillStyle=fg;cx.fillRect(o-W*.1,y,W*1.2,H*.12)}}
  if(k==='rain'||k==='storm'){cx.strokeStyle='rgba(205,225,255,.6)';cx.lineWidth=1.3*skyMul;cx.lineCap='round';cx.beginPath();const sp=k==='storm'?1.5:1.1;
    SC.drops.forEach(p=>{p.y+=p.v*sp*dt;p.x-=p.v*sp*dt*.14;if(p.y>1.05){p.y=-.05;p.x=Math.random()*1.1}const x=p.x*W,y=p.y*H,l=p.l*16*skyMul;cx.moveTo(x,y);cx.lineTo(x-l*.22,y+l)});cx.stroke()}
  if(k==='snow'){cx.fillStyle='rgba(255,255,255,.9)';SC.drops.forEach(p=>{p.y+=p.v*.11*dt;if(p.y>1.05){p.y=-.05;p.x=Math.random()}cx.beginPath();cx.arc((p.x+Math.sin(SC.t*.8+p.ph)*.012)*W,p.y*H,(1.2+p.l*1.6)*skyMul,0,6.29);cx.fill()})}

    if(SC.flash>0){if(SC.bolt&&SC.flash>.35){cx.save();cx.shadowColor='#BFD4FF';cx.shadowBlur=22*skyMul;cx.strokeStyle='#FFFFFF';cx.lineWidth=2.6*skyMul;cx.lineJoin='round';cx.beginPath();SC.bolt.forEach(([x,y],i)=>i?cx.lineTo(x,y):cx.moveTo(x,y));cx.stroke();cx.restore()}

const RD={map:null,base:null,marker:null,frames:[],layers:[],host:'',i:0,timer:null,state:'idle'};

  m.hidden=false;m.innerHTML=`<div><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg><b></b><span></span></div>`;
  m.querySelector('b').textContent=t(kind==='off'?'mapOffB':'mapErrB');m.querySelector('span').textContent=t(kind==='off'?'mapOffT':'mapErrT')}

  gLegend();if(G.started)gState();if(G.ok===false)gMsg(t('gNoGL'));
}
[['#uT','unitT'],['#uW','unitW'],['#uL','lang'],['#uTh','theme']].forEach(([id,k])=>$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b||prefs[k]===b.dataset.v)return;
  prefs[k]=b.dataset.v;store.set('hd-prefs',prefs);applyStatic();if(k==='theme'){applyTheme();return}
  if(k==='lang'){fillCountries();if(S.city)sync(S.city);buildChips()}
  render();renderFavs();
}));

let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{size();renderChart();if(still)frame(0,true);if(RD.map)RD.map.invalidateSize();gSize()},120)});
setInterval(()=>{if(S.city&&S.live){load(S.city);loadFavs()}},10*60*1000);

let start=store.get('hd-city',null);if(!start||typeof start.lat!=='number')start=ALL[0];
applyTheme();fillCountries();buildChips();applyStatic();renderFavs();size();sync(start);load(start);
if(!still)requestAnimationFrame(frame);
})();
</script>

</body>
</html>
